# Downloads the CPanama listings from the owner's public Google Drive folder, builds the
# /properties/ catalog (properties.json + img/props) and pushes it to branch cpanama-import.
# Runs on a push to branch cpanama-import-run, or by hand from the Actions tab.
name: Import CPanama catalog
on:
  push:
    branches: [cpanama-import-run]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dental-clinics-site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown==5.2.0 pillow==11.0.0
      - name: Download the Drive folder
        run: |
          gdown --folder "https://drive.google.com/drive/folders/10StA3DCPNv8dhcGQu6TQESMJ4HiJokCp" -O "$RUNNER_TEMP/in" --remaining-ok
          find "$RUNNER_TEMP/in" -maxdepth 2 | head -50
          du -sh "$RUNNER_TEMP/in"
      - name: Build the catalog
        run: python3 scripts/build_properties.py "$RUNNER_TEMP/in"
      - name: Push the result to branch cpanama-import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b cpanama-import
          git add panama-crypto-homes/properties.json panama-crypto-homes/img/props
          git commit -m "CPanama catalog import from Google Drive"
          git push -f origin cpanama-import
