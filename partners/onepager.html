<html lang="es">
<head>
<meta charset="utf-8">
<title>Restate Deals One-Pager</title>
<meta name="robots" content="noindex">

<style>
/* Source for the 2-page A4 PDF. Rendered with Playwright: onepager.html?lang=es|en */
:root{--paper:#0a0b0d;--card:#13161a;--ink:#f3efe7;--slate:#a29d93;--mute:#8a857c;--rule:rgba(255,255,255,.1);--graphite:#0e1013;--g2:#1a1d22;--ld:rgba(255,255,255,.12);--od:#f3efe7;--od2:#a29d93;--ok:#7fd8a6;--okbg:rgba(127,216,166,.12);--okd:#7fd8a6;--bad:#f08a8a;--badbg:rgba(240,138,138,.1);--accent:#d6b073;--gold:#d6b073;--goldLine:rgba(214,176,115,.4);
  --sans:"Inter",Arial,sans-serif;--display:"Plus Jakarta Sans",Arial,sans-serif;--mono:"Plus Jakarta Sans",Arial,sans-serif}
@page{size:A4;margin:0}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:400 10.5px/1.45 var(--sans);color:var(--ink);background:#ccc}
.page{width:210mm;height:297mm;background:var(--paper);padding:13mm 14mm;display:flex;flex-direction:column;gap:6mm;overflow:hidden;margin:0 auto 10px;page-break-after:always}
.page:last-child{page-break-after:auto}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
.lbl{font:600 7.5px/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--goldLine);padding-bottom:3.5mm}
.logo{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.logo svg{width:20px;height:20px}
h1{font-size:25px;letter-spacing:-.03em}
.sub{font-size:12px;color:var(--slate);margin-top:3mm;max-width:165mm}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--goldLine);border-bottom:1px solid var(--rule)}
.fact{padding:2.6mm 3mm 2.6mm 0}
.fact+.fact{padding-left:3mm;border-left:1px solid var(--rule)}
.fact b{display:block;font:800 16px/1.1 var(--display);color:var(--gold)}
.fact span{color:var(--mute);font-size:9px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;margin-bottom:2.5mm}
.sh h2{font-size:14px}
.lane{display:grid;grid-template-columns:30mm 1fr;gap:3mm;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:3mm;margin-bottom:2mm}
.lane.good{border-color:var(--goldLine)}
.lane-h b{display:block;font-size:10px;margin-top:1.5mm;line-height:1.25}
.tag{display:inline-block;font:500 7.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;border-radius:2px}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:rgba(214,176,115,.14);color:var(--gold)}
.steps{display:flex;gap:0}
.st{flex:1;display:flex;align-items:stretch;min-width:0}
.box{flex:1;border:1px solid var(--rule);border-radius:6px;padding:2mm;font-size:9px;line-height:1.3;background:var(--g2)}
.box .lbl{display:block;font-size:7px;margin-bottom:1mm}
.ar{width:4mm;display:grid;place-items:center;color:var(--mute);font-size:9px}
.st:last-child .ar{display:none}
.lane.bad .box.end{border-color:var(--bad);background:var(--badbg);color:var(--bad);font-weight:600}
.lane.good .box.end{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.lv{display:grid;grid-template-columns:34mm 1fr 52mm;gap:4mm;padding:2.6mm 0;border-bottom:1px solid var(--rule)}
.lvs{border-top:1px solid var(--goldLine)}
.lv h3{font-size:11.5px}
.lv p{color:var(--slate);font-size:9.5px}
.lv .res{color:var(--ink);font-weight:600;border-left:2px solid var(--gold);padding-left:2.5mm}
.cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#e2c08a,#c99a5c);color:#17120a;border-radius:4px;padding:4mm 5mm;gap:4mm}
.cta b{font-size:13px;font-weight:600}
.cta span{font:600 9.5px/1.4 var(--display);color:#2a1f10;text-align:right}
/* page 2 */
.gantt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:3mm 4mm}
.gr{display:grid;grid-template-columns:62mm 1fr;gap:4mm;align-items:center;padding:2mm 0;border-bottom:1px solid var(--rule)}
.gr:last-child{border-bottom:0}
.gr .t{font-weight:600;font-size:10px}
.gr .t .lbl{display:block;margin-bottom:.6mm}
.gr .d{color:var(--slate);font-size:8.6px;margin-top:.6mm}
.track{position:relative;height:6mm;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/6 - 1px),var(--rule) calc(100%/6 - 1px),var(--rule) calc(100%/6))}
.bar{position:absolute;top:1.2mm;bottom:1.2mm;border-radius:3px;background:linear-gradient(180deg,#e2c08a,#c99a5c);color:#17120a;font-weight:700;font:500 7.5px/1 var(--mono);display:flex;align-items:center;padding:0 1.6mm}
.b2{background:linear-gradient(180deg,#c99a5c,#a8743d)}.b3{background:rgba(214,176,115,.15);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldLine)}.b4{background:var(--ok);color:#0b2417}
.dark{background:var(--card);border:1px solid var(--rule);color:var(--od);border-radius:8px;padding:4mm}
.dark .lbl{color:var(--od2)}
.flow{display:grid;grid-template-columns:1fr 9mm 1fr 9mm 1fr 9mm 1fr;margin-top:3mm}
.node{border:1px solid var(--ld);border-radius:3px;background:var(--g2);padding:2.6mm;display:flex;flex-direction:column;gap:1.4mm}
.node.us{border-color:var(--goldLine)}.node.end{border-color:var(--okd)}
.node h3{font-size:10px}
.node .s{color:var(--od2);font-size:8.4px}
.node ul{list-style:none;margin:auto 0 0;padding:1.6mm 0 0;border-top:1px solid var(--ld);font-size:8.2px;display:flex;flex-direction:column;gap:1mm}
.node li::before{content:"● ";color:var(--okd);font-size:6px;vertical-align:1px}
.arr{display:grid;place-items:center;color:var(--od2);font-size:11px}
.dark .q{margin-top:3mm;font-size:10px;color:var(--od);border-top:1px solid var(--ld);padding-top:2.6mm}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.list{border-top:1px solid var(--goldLine)}
.li{padding:2mm 0;border-bottom:1px solid var(--rule)}
.li b{font-size:10px;font-weight:600}
.li p{color:var(--slate);font-size:8.8px;margin-top:.5mm}
.foot{margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;border-top:1px solid var(--goldLine);padding-top:3mm;font-size:8.8px;color:var(--slate)}
.foot b{color:var(--ink)}
.pn{font:500 8px/1 var(--mono);color:var(--mute)}
@media print{body{background:none}.page{margin:0}}
</style>
</head>
